<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MusicStream | Mi Biblioteca</title>
    <link rel="stylesheet" href="../css/stylemain.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/componentes.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h1 style="color: white; margin-bottom: 2rem;">gigamusic</h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="../index.html">Descubrir</a></li>
                    <li><a href="profile.html" class="active">Mi Biblioteca</a></li>
                    <li><a href="develop.html">🛒 Carrito</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header style="margin-bottom: 2rem;">
                <h2>Mi Biblioteca Musical</h2>
                <p style="color: var(--text-secondary);">Todos los álbumes que has adquirido en alta fidelidad.</p>
            </header>

            <section class="new-releases">
                <div class="album-grid" id="libraryGrid">
                    <p style="color: var(--text-secondary);">Cargando tu biblioteca...</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        async function loadLibrary() {
            const currentUser = JSON.parse(localStorage.getItem('gigamusic_user'));
            const libraryGrid = document.getElementById('libraryGrid');

            if (!currentUser || !currentUser.id) {
                libraryGrid.innerHTML = '<p style="color: var(--text-secondary);">Inicia sesión para ver tu biblioteca. <a href="login.html" style="color: var(--accent);">Ir al Login</a></p>';
                return;
            }

            try {
                const res = await fetch(`http://localhost:4000/api/auth/profile/${currentUser.id}`);
                if (!res.ok) throw new Error('No se pudo obtener el perfil');
                
                const userData = await res.json();
                
                libraryGrid.innerHTML = '';
                
                if (!userData.purchasedAlbums || userData.purchasedAlbums.length === 0) {
                    libraryGrid.innerHTML = '<p style="color: var(--text-secondary);">Aún no has comprado ningún álbum. ¡Explora la tienda!</p>';
                    return;
                }

                userData.purchasedAlbums.forEach(album => {
                    const card = document.createElement('article');
                    card.className = 'album-card';
                    card.innerHTML = `
                        <a href="now play.html?id=${album._id}">
                            <div class="album-art-container">
                                <img src="${album.coverImage}" alt="${album.title}" style="width:100%; height:100%; object-fit:cover;">
                                <div class="quick-action" style="background: #10b981;">▶ Escuchar Completo</div>
                            </div>
                            <h4 style="margin-bottom: 4px; color: white;">${album.title}</h4>
                            <p style="color: var(--text-secondary); font-size: 0.85rem;">${album.artist}</p>
                        </a>
                    `;
                    libraryGrid.appendChild(card);
                });
            } catch (err) {
                console.error("Error al cargar biblioteca:", err);
                libraryGrid.innerHTML = '<p style="color: #ef4444;">Error al cargar tus álbumes comprados.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadLibrary);
    </script>
</body>
</html>
