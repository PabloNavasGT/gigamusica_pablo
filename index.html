<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAGiMUSIC</title>
    <link rel="stylesheet" href="css/stylemain.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/componentes.css">
    <!-- SCRIPT DE PROTECCIÓN: Bloquea el acceso si no hay sesión -->
    <script src="js/authGuard.js"></script>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <h1 style="color: white; margin-bottom: 2rem;">gigamusic</h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Descubrir</a></li>
                    <li><a href="html/profile.html">Mi Biblioteca</a></li>
                    <li><a href="html/develop.html">🛒 Carrito</a></li>
                    <li><a href="#" id="logoutBtn" style="color: #ef4444; margin-top: 2rem; display: block;">🚪 Cerrar Sesión</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <input type="text" placeholder="Buscar artista..." style="padding: 10px; background: #1e293b; border: none; color: white; border-radius: 8px; width: 300px;">
                <button id="openModalBtn" class="btn btn-primary">+ Nuevo Álbum</button>
            </header>

            <section class="new-releases">
                <div class="section-header">
                    <h3>Catálogo Musical (MongoDB)</h3>
                </div>
                <div class="album-grid" id="albumGrid"></div>
            </section>
        </main>
    </div>

    <!-- MODAL PARA CREAR ÁLBUM Y LISTADO DE CANCIONES -->
    <div id="albumModal" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; overflow-y: auto; padding: 2rem;">
        <div style="background: #1e293b; padding: 2rem; border-radius: 12px; width: 600px; border: 1px solid #334155; max-height: 90vh; overflow-y: auto;">
            <h3 style="margin-bottom: 1.5rem; color: white;">Registrar Nuevo Álbum</h3>
            <form id="albumForm">
                <div style="margin-bottom: 1rem;">
                    <label style="color: var(--text-secondary); display: block; margin-bottom: 0.5rem;">Nombre del Álbum</label>
                    <input type="text" id="albumTitle" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="color: var(--text-secondary); display: block; margin-bottom: 0.5rem;">Fecha de Salida</label>
                    <input type="date" id="albumReleaseDate" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="color: var(--text-secondary); display: block; margin-bottom: 0.5rem;">Nombre del Artista</label>
                    <input type="text" id="albumArtist" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px;">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="color: var(--text-secondary); display: block; margin-bottom: 0.5rem;">Foto de Portada (URL)</label>
                    <input type="text" id="albumCover" placeholder="/gigamusic-pablo/imagenes/portada.jpg" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="color: var(--text-secondary); display: block; margin-bottom: 0.5rem;">Precio del Álbum ($)</label>
                    <input type="number" step="0.01" id="albumPrice" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px;">
                </div>

                <hr style="border: 0; border-top: 1px solid #334155; margin: 1.5rem 0;">

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h4 style="color: white;">Listado de Canciones</h4>
                    <button type="button" id="addSongBtn" class="btn" style="background: #3b82f6; color: white; font-size: 0.8rem; padding: 6px 12px;">+ Agregar Canción</button>
                </div>
                
                <div id="songsContainer" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem;"></div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                    <button type="button" id="closeModalBtn" class="btn" style="background: #334155; color: white;">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar y Reproducir</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('gigamusic_user');
            localStorage.removeItem('gigamusic_cart');
            window.location.href = 'html/login.html';
        });
    </script>
    <script src="js/index.js"></script>
</body>
</html>
