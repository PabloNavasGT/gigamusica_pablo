<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStream | Now Playing</title>
    <link rel="stylesheet" href="../css/stylemain.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body>

    <div class="immersive-bg"></div>

    <div class="player-layout">
        <a href="../index.html" class="back-btn">← Volver a la Tienda</a>

        <main class="player-stage">
            <div class="album-glow-container" style="text-align: center;">
                <div class="art-wrapper" style="width: 250px; height: 250px; margin: 0 auto; border-radius: 12px; overflow: hidden;">
                    <img id="albumCoverImg" src="" alt="Portada" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="track-info" style="margin-top: 1.5rem;">
                    <h1 id="albumTitleMain" class="track-title" style="font-size: 2rem; color: white;">Cargando álbum...</h1>
                    <h2 id="albumArtistMain" class="artist-name" style="color: var(--text-secondary);">Artista</h2>
                    <p id="albumReleaseDate" style="font-size: 0.8rem; color: var(--accent); margin-top: 5px;"></p>
                </div>
            </div>
        </main>

        <aside class="playlist-sidebar" style="background: #1e293b; padding: 1.5rem; border-radius: 12px; border: 1px solid #334155;">
            <h3 style="margin-bottom: 1rem; color: white;">Listado de Canciones</h3>
            <ul id="queueList" class="queue-list" style="list-style: none; display: flex; flex-direction: column; gap: 0.75rem;"></ul>
        </aside>
    </div>

    <script src="../js/player.js"></script>
</body>
</html>
