<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigaMusic | Reproductor</title>
    <link rel="stylesheet" href="../css/stylemain.css">
    <link rel="stylesheet" href="../css/player_style.css">
    <script src="../js/authGuard.js"></script>
</head>
<body>

    <div class="player-container">
        <!-- Barra de navegación superior -->
        <header class="top-nav">
            <a href="../index.html" class="back-link">← Volver a la Tienda</a>
        </header>

        <ul class="nav-links">
    <li><a href="../index.html">Descubrir</a></li>
    <li><a href="library.html">Mi Biblioteca</a></li>
    <li><a href="develop.html">Carrito</a></li>
    <li><a href="#" id="logoutBtn">Cerrar Sesión</a></li>
</ul>

        <div class="player-grid">
            <!-- Columna Izquierda: Información y Arte del Álbum -->
            <aside class="album-info-card">
                <div class="album-cover-wrapper">
                    <img id="albumCoverImg" src="" alt="Portada del Álbum">
                    <span id="albumPriceBadge" class="album-price-tag">$0.00</span>
                </div>

                <h2 id="albumTitleMain" class="album-meta-title">Cargando...</h2>
                <h3 id="albumArtistMain" class="album-meta-artist">...</h3>
                <p id="albumReleaseDate" class="album-meta-date">Lanzamiento: --/--/----</p>

                <div id="playerStage" class="album-action-area">
                    <!-- Botón de carrito o mensaje de propiedad generado por player.js -->
                </div>
            </aside>

            <!-- Columna Derecha: Consola de Pistas / Canciones -->
            <main class="tracks-panel">
                <div class="tracks-panel-header">
                    <h3 class="tech-font" style="color: var(--text-primary);">Listado de Canciones</h3>
                    <div class="vu-meter-bar" style="width: 120px; margin: 0;"></div>
                </div>

                <ul id="queueList" class="queue-list-container">
                    <!-- Las canciones se inyectan dinámicamente -->
                </ul>
            </main>
        </div>
    </div>

    <script src="../js/player.js"></script>
</body>
</html>
